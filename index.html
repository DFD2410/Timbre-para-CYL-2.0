<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIMBRE v31.1 - FIX CONTADOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        :root { --cian: #00f7ff; --fondo: #050505; --panel: #141419; --purpura: #bc13fe; --rojo: #ff0044; --naranja: #ff6600; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--fondo); color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; transition: background 0.4s; }
        body.edit-active { background: var(--naranja); }
        #app { display: none; width: 100%; max-width: 500px; padding-top: 50px; position: relative; }
        .btn-logout { position: absolute; top: 5px; right: 0; background: var(--rojo); color: white; border: none; padding: 10px 15px; border-radius: 12px; font-family: 'Orbitron'; font-size: 0.7rem; cursor: pointer; font-weight: 900; z-index: 1000; }
        .tarjeta { background: var(--panel); padding: 20px; border-radius: 25px; border: 1px solid #222; text-align: center; margin-bottom: 15px; width: 100%; }
        #reloj-actual { font-family: 'Orbitron', sans-serif; font-size: 3rem; color: var(--cian); text-shadow: 0 0 15px var(--cian); }
        #tipo-dia { font-size: 0.9rem; padding: 6px 15px; border-radius: 50px; display: inline-block; font-weight: 900; text-transform: uppercase; background: #333; margin-bottom: 10px; }
        .pantalla-prox { background: #000; padding: 20px; border-radius: 20px; border: 3px solid var(--purpura); margin: 15px 0; min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
        #nombre-prox-timbre { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--purpura); margin-bottom: 5px; text-transform: uppercase; }
        #cuenta-atras { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; }
        .item-cloud { background: #0a0a0a; padding: 15px; border-radius: 15px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        input, button { width: 100%; padding: 15px; border-radius: 15px; border: none; font-family: 'Rajdhani'; font-size: 1.1rem; margin-bottom: 10px; }
        input { background: #000; color: white; border: 1px solid #333; }
        .btn-cian { background: var(--cian); color: #000; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; }
        .btn-act { background: var(--purpura); color: white; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; }
        .parpadeo-5s { animation: p5s 0.4s infinite; color: var(--rojo) !important; }
        @keyframes p5s { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
    </style>
</head>
<body>

    <div id="login-overlay" style="position:fixed; inset:0; background:#000; display:flex; justify-content:center; align-items:center; z-index:9000;">
        <div style="background:#111; padding:30px; border-radius:30px; border:2px solid var(--cian); width:90%; max-width:340px; text-align:center;">
            <h2 style="color:var(--cian); font-family:'Orbitron'; margin-bottom:20px;">ACCESO</h2>
            <input type="email" id="correo" placeholder="Email">
            <input type="password" id="clave" placeholder="Contraseña">
            <button class="btn-cian" onclick="ejecutarAuth()">ENTRAR</button>
        </div>
    </div>

    <div id="app">
        <button class="btn-logout" onclick="auth.signOut()">CERRAR SESIÓN</button>
        <div class="tarjeta">
            <div id="tipo-dia">DÍA LECTIVO</div>
            <div id="reloj-actual">00:00:00</div>
            <div id="fecha-texto" style="color: #666; font-size: 0.9rem; text-transform: uppercase; margin-bottom:10px;">...</div>
            <div class="pantalla-prox" id="box-c">
                <div id="nombre-prox-timbre">CARGANDO...</div>
                <div id="cuenta-atras">00:00:00</div>
            </div>
            <div style="background:#000; padding:15px; border-radius:20px; border:1px solid #222;">
                <p id="audio-label" style="font-size:0.7rem; color:var(--cian); margin-bottom:10px; font-weight: bold;">SIN AUDIO</p>
                <input type="file" id="f-in" style="display:none" accept="audio/*" onchange="subirAudio(this)">
                <button onclick="document.getElementById('f-in').click()" class="btn-cian" style="font-size:0.8rem; padding: 12px;">📤 SUBIR MP3</button>
                <button onclick="activarAudio()" id="btn-master" class="btn-act">🔓 ACTIVAR SONIDO</button>
            </div>
        </div>

        <div class="tarjeta" id="form-card">
            <h3 id="form-titulo" style="font-family:Orbitron; font-size:0.9rem; margin-bottom:10px;">NUEVO TIMBRE</h3>
            <input type="text" id="t-nombre" placeholder="Nombre (Ej: Recreo)">
            <input type="time" id="h-in" step="1">
            <div style="display:flex; justify-content:space-around; margin-bottom:15px; background:#000; padding:12px; border-radius:12px;">
                <label><input type="checkbox" class="d-check" value="1" checked> L</label>
                <label><input type="checkbox" class="d-check" value="2" checked> M</label>
                <label><input type="checkbox" class="d-check" value="3" checked> X</label>
                <label><input type="checkbox" class="d-check" value="4" checked> J</label>
                <label><input type="checkbox" class="d-check" value="5" checked> V</label>
            </div>
            <button id="btn-guardar" class="btn-cian" onclick="subirTimbre()">GUARDAR</button>
            <button id="btn-cancelar" style="display:none; background:white; color:black; font-weight:bold;" onclick="cancelarEdicion()">CANCELAR</button>
            <div id="lista-cloud" style="margin-top:20px;"></div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCnIgaMrFFnqQRnu-mha9NDs1c-xlBIqoc",
        authDomain: "timbre-c96dc.firebaseapp.com",
        projectId: "timbre-c96dc",
        storageBucket: "timbre-c96dc.appspot.com",
        messagingSenderId: "203518767791",
        appId: "1:203518767791:web:c27079008efbf420441a5a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let player = new Audio();
    let audioUnlocked = false;
    let timbres = [];
    let editandoID = null;

    async function ejecutarAuth() {
        const e = document.getElementById('correo').value;
        const p = document.getElementById('clave').value;
        try { await auth.signInWithEmailAndPassword(e, p); } 
        catch(err) { await auth.createUserWithEmailAndPassword(e, p); }
    }

    async function subirAudio(input) {
        const file = input.files[0];
        if (!file) return;
        document.getElementById('audio-label').innerText = "SUBIENDO...";
        const reader = new FileReader();
        reader.onload = async (e) => {
            const doc = await db.collection("biblioteca").add({ uid: auth.currentUser.uid, nombre: file.name, data: e.target.result });
            await db.collection("config").doc(auth.currentUser.uid).set({ audioActivoId: doc.id });
        };
        reader.readAsDataURL(file);
    }

    function activarAudio() {
        player.play().then(() => {
            player.pause();
            audioUnlocked = true;
            document.getElementById('btn-master').innerText = "✅ SISTEMA LISTO";
            document.getElementById('btn-master').style.background = "#004422";
        });
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            db.collection("timbres").where("uid", "==", user.uid).onSnapshot(snap => { 
                timbres = snap.docs.map(doc => ({id: doc.id, ...doc.data()})); 
                pintarTimbres(); 
            });
            db.collection("config").doc(user.uid).onSnapshot(doc => {
                if(doc.exists && doc.data().audioActivoId) {
                    db.collection("biblioteca").doc(doc.data().audioActivoId).get().then(a => {
                        if(a.exists()) {
                            player.src = a.data().data;
                            document.getElementById('audio-label').innerText = "AUDIO: " + a.data().nombre;
                        }
                    });
                }
            });
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
        }
    });

    function pintarTimbres() {
        const dSem = ["D", "L", "M", "X", "J", "V", "S"];
        timbres.sort((a,b) => a.hora.localeCompare(b.hora));
        document.getElementById('lista-cloud').innerHTML = timbres.map(t => `
            <div class="item-cloud">
                <div style="text-align:left;">
                    <span style="color:var(--cian); font-weight:900; font-size:0.7rem; text-transform:uppercase;">${t.nombre}</span>
                    <div style="font-family:Orbitron; font-size:1.5rem;">${t.hora.substring(0,5)}</div>
                    <div style="font-size:0.8rem; color:var(--purpura); font-weight:bold;">${t.dias.map(d => dSem[d]).join(" ")}</div>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <button style="width:60px; padding:8px; background:var(--naranja); font-size:0.6rem; color:white;" onclick="prepararEdicion('${t.id}')">EDIT</button>
                    <button style="width:60px; padding:8px; background:#222; font-size:0.6rem; color:white;" onclick="db.collection('timbres').doc('${t.id}').delete()">BORRAR</button>
                </div>
            </div>`).join('');
    }

    function prepararEdicion(id) {
        const t = timbres.find(i => i.id === id);
        editandoID = id;
        document.getElementById('t-nombre').value = t.nombre;
        document.getElementById('h-in').value = t.hora;
        document.querySelectorAll('.d-check').forEach(c => c.checked = t.dias.includes(c.value));
        document.body.classList.add('edit-active');
        document.getElementById('btn-guardar').innerText = "ACTUALIZAR";
        document.getElementById('btn-cancelar').style.display = "block";
    }

    function cancelarEdicion() {
        editandoID = null;
        document.body.classList.remove('edit-active');
        document.getElementById('btn-guardar').innerText = "GUARDAR";
        document.getElementById('btn-cancelar').style.display = "none";
        document.getElementById('t-nombre').value = "";
    }

    async function subirTimbre() {
        const h = document.getElementById('h-in').value;
        const n = document.getElementById('t-nombre').value;
        const d = Array.from(document.querySelectorAll('.d-check:checked')).map(c => c.value);
        if(!h) return;
        const data = { uid: auth.currentUser.uid, hora: h.length===5?h+":00":h, nombre: n || "Timbre", dias: d };
        if(editandoID) { await db.collection("timbres").doc(editandoID).update(data); cancelarEdicion(); }
        else { await db.collection("timbres").add(data); document.getElementById('t-nombre').value = ""; }
    }

    setInterval(() => {
        const ahora = new Date();
        const dS = ahora.getDay();
        const hStr = ahora.toTimeString().split(' ')[0];
        document.getElementById('reloj-actual').innerText = ahora.toLocaleTimeString();
        document.getElementById('fecha-texto').innerText = ahora.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

        // Tipo de día
        let tTxt = "DÍA LECTIVO"; let col = "#004422";
        if(dS === 0 || dS === 6) { tTxt = "FIN DE SEMANA"; col = "#444"; }
        const badge = document.getElementById('tipo-dia'); badge.innerText = tTxt; badge.style.background = col;

        // Sonar timbre
        timbres.forEach(t => { if(t.hora === hStr && t.dias.includes(dS.toString()) && audioUnlocked) { player.currentTime = 0; player.play(); } });

        // CUENTA ATRÁS REPARADA
        const prox = timbres.filter(t => t.dias.includes(dS.toString()) && t.hora > hStr).sort((a,b) => a.hora.localeCompare(b.hora))[0];
        const dispC = document.getElementById('cuenta-atras');
        const dispN = document.getElementById('nombre-prox-timbre');

        if(prox) {
            let [h, m, s] = prox.hora.split(':');
            let tD = new Date(); tD.setHours(h, m, s, 0);
            let diff = Math.floor((tD.getTime() - ahora.getTime()) / 1000);
            dispN.innerText = "PRÓXIMO: " + prox.nombre;
            
            dispC.classList.remove('parpadeo-5s');
            if(diff <= 5 && diff >= 0) dispC.classList.add('parpadeo-5s');
            else if(diff <= 30 && diff >= 0) dispC.style.color = "var(--rojo)";
            else dispC.style.color = "white";

            let hh = Math.floor(diff/3600).toString().padStart(2,'0'), mm = Math.floor((diff%3600)/60).toString().padStart(2,'0'), ss = (diff%60).toString().padStart(2,'0');
            dispC.innerText = `${hh}:${mm}:${ss}`;
        } else { 
            dispC.innerText = "00:00:00"; 
            dispN.innerText = "SIN MÁS TIMBRES HOY";
            dispC.style.color = "white";
        }
    }, 1000);
</script>
</body>
</html>
